<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACE | Connected Platforms</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-start: #713b5c;
      --bg-middle: #493044;
      --bg-end: #29272d;
      --purple: #8956e8;
      --purple-light: #a37aff;
      --text: #ffffff;
      --card: #cbd4dc;
      --card-text: #25232a;
      --border: rgba(255, 255, 255, 0.24);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(
          ellipse at 5% 15%,
          rgba(151, 69, 119, 0.24),
          transparent 45%
        ),
        linear-gradient(
          110deg,
          var(--bg-start) 0%,
          var(--bg-middle) 48%,
          var(--bg-end) 100%
        );
      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* Header */

    .topbar {
      height: 92px;
      margin: 0 3.4%;
      border-bottom: 3px solid rgba(226, 215, 225, 0.42);
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .brand h1 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(29px, 3.1vw, 43px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .brand p {
      font-size: 14px;
      margin-top: 8px;
      color: #eee2ec;
      letter-spacing: 0.1px;
    }

    /* Main layout */

    .layout {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr);
      gap: clamp(24px, 4vw, 52px);
      padding: 12px 5.5% 36px 1.8%;
      align-items: start;
    }

    /* SIDEBAR */
        .sidebar {
            padding: 18px 12px;
            background: rgba(232, 232, 232, 0.91);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .nav-item {
            min-height: 45px;
            padding: 12px 13px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            color: white;
            background: var(--purple);
            border: 1px solid transparent;
            border-radius: 10px;
            text-decoration: none;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            white-space: normal;
            transition: background 0.2s, transform 0.2s;
        }

        .nav-item:hover {
            background: var(--purple-hover);
            transform: translateX(2px);
        }

        .nav-item.active {
            background: #7040d3;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 14px rgba(76, 31, 159, 0.2);
        }

        .sidebar-divider {
            height: 1px;
            margin: 12px 5px;
            background: rgba(255, 255, 255, 0.65);
        }

    /* Content area */

    .main-content {
      width: 100%;
      max-width: 820px;
      min-width: 0;
      margin: 0 auto;
    }

    .page-title {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(25px, 3.4vw, 40px);
      line-height: 1.3;
      font-weight: 800;
      text-align: center;
      letter-spacing: -1.2px;
      margin: -5px 0 23px;
    }

    .import-note {
      margin: -10px 0 20px;
      color: #eee2ec;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .platform-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .platform-card {
      min-height: 122px;
      padding: 23px 28px 20px;
      border-radius: 27px;
      background: var(--card);
      color: var(--card-text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 17px;
      box-shadow: 0 8px 22px rgba(23, 19, 28, 0.08);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .platform-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(20, 15, 25, 0.16);
    }

    .platform-name {
      font-size: 14px;
      font-weight: 500;
      padding-left: 1px;
    }

    .connect-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(112px, auto) auto;
      align-items: center;
      gap: 12px;
    }

    .url-input {
      width: 100%;
      max-width: 285px;
      min-width: 0;
      height: 39px;
      padding: 0 14px;
      border: 1px solid #92969a;
      border-radius: 11px;
      outline: none;
      background: rgba(255, 255, 255, 0.14);
      color: #29272d;
      text-align: center;
      font-size: 13px;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .url-input::placeholder {
      color: #62676c;
      font-weight: 600;
    }

    .url-input:focus {
      border-color: #8652db;
      box-shadow: 0 0 0 3px rgba(134, 82, 219, 0.15);
    }

    .connect-btn {
      min-width: 149px;
      min-height: 39px;
      padding: 10px 15px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(
        110deg,
        #74385e,
        #29272d
      );
      color: white;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .connect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(53, 35, 55, 0.28);
    }

    .connect-btn:disabled {
      opacity: 0.75;
      cursor: wait;
    }

    .json-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .json-label {
      min-height: 39px;
      padding: 10px 13px;
      border: 1px solid #92969a;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #29272d;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .json-input:focus-visible + .json-label {
      outline: 3px solid rgba(134, 82, 219, 0.35);
      outline-offset: 2px;
    }

    .status {
      font-size: 12px;
      min-height: 0;
      line-height: 1.5;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      color: #a12539;
    }

    .status.success {
      color: #176a47;
    }

    /* Responsive layout */

    @media (min-width: 1200px) {
      .layout {
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 50px;
      }

      .sidebar {
        gap: 12px;
      }

      .nav-link {
        min-height: 49px;
        font-size: 13px;
      }

      .main-content {
        max-width: 850px;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        height: 85px;
        margin: 0 4%;
        padding: 0 6px;
      }

      .brand h1 {
        font-size: 32px;
      }

      .brand p {
        font-size: 12px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 20px 5% 35px;
      }

      .sidebar {
        margin-top: 0;
        padding: 10px;
        border-radius: 18px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .nav-link {
        min-height: 42px;
        padding: 8px 3px;
        font-size: 10px !important;
        border-radius: 10px;
      }

      .nav-divider {
        display: none;
      }

      .page-title {
        font-size: clamp(22px, 6vw, 32px);
        margin: 0 0 20px;
      }

      .platform-card {
        padding: 22px 18px;
        border-radius: 22px;
      }

      .connect-row {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      .url-input {
        grid-column: 1 / -1;
        max-width: none;
      }

      .connect-btn { width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <h1>TRACE</h1>
      <p>your personalized coding intelligence</p>
    </div>
  </header>

  <div class="layout">
    {% include "_sidebar.html" %}

    <main class="main-content">
      <h2 class="page-title">CONNECTED PLATFORMS</h2>
      <p class="import-note">Save a profile URL directly. LeetCode JSON files containing problem history are imported into Coding History; this does not connect to or fetch data from platform accounts.</p>

      <section class="platform-list" aria-label="Coding platforms">

        <article class="platform-card" data-platform="Codeforces">
          <label class="platform-name" for="codeforces-url">
            CodeForces
          </label>

          <div class="connect-row">
            <input
              class="url-input"
              id="codeforces-url"
              type="url"
              placeholder="Enter URL"
              aria-label="Codeforces profile URL"
              autocomplete="url"
            />

            <input class="json-input" id="codeforces-json" type="file" accept=".json,application/json" aria-label="Import Codeforces profile from JSON" />
            <label class="json-label" for="codeforces-json">Choose JSON</label>

            <button class="connect-btn" type="button">
              Connect Platforms
            </button>
          </div>

          <p class="status" aria-live="polite"></p>
        </article>

        <article class="platform-card" data-platform="GeeksforGeeks">
          <label class="platform-name" for="gfg-url">
            GeeksForGeeks
          </label>

          <div class="connect-row">
            <input
              class="url-input"
              id="gfg-url"
              type="url"
              placeholder="Enter URL"
              aria-label="GeeksforGeeks profile URL"
              autocomplete="url"
            />

            <input class="json-input" id="gfg-json" type="file" accept=".json,application/json" aria-label="Import GeeksforGeeks profile from JSON" />
            <label class="json-label" for="gfg-json">Choose JSON</label>

            <button class="connect-btn" type="button">
              Connect Platforms
            </button>
          </div>

          <p class="status" aria-live="polite"></p>
        </article>

        <article class="platform-card" data-platform="LeetCode">
          <label class="platform-name" for="leetcode-url">
            LeetCode
          </label>

          <div class="connect-row">
            <input
              class="url-input"
              id="leetcode-url"
              type="url"
              placeholder="Enter URL"
              aria-label="LeetCode profile URL"
              autocomplete="url"
            />

            <input class="json-input" id="leetcode-json" type="file" accept=".json,application/json" aria-label="Import LeetCode profile from JSON" />
            <label class="json-label" for="leetcode-json">Import History JSON</label>

            <button class="connect-btn" type="button">
              Connect Platforms
            </button>
          </div>

          <p class="status" aria-live="polite"></p>
        </article>

      </section>
    </main>
  </div>

  <script>
    const platformCards = document.querySelectorAll(".platform-card");

    const platformHosts = {
      Codeforces: ["codeforces.com"],
      GeeksforGeeks: ["geeksforgeeks.org"],
      LeetCode: ["leetcode.com"]
    };
    const savedLinks = {{ connections|tojson }};

    platformCards.forEach((card) => {
      const platform = card.dataset.platform;
      const input = card.querySelector(".url-input");
      const fileInput = card.querySelector(".json-input");
      const button = card.querySelector(".connect-btn");
      const status = card.querySelector(".status");
      const savedLink = savedLinks.find((item) => item.platform === platform);

      if (savedLink) {
        input.value = savedLink.profile_url;
        status.textContent = "Profile link saved. Account data has not been imported.";
      }

      button.addEventListener("click", async () => {
        const value = input.value.trim();

        status.className = "status";
        status.textContent = "";

        if (!value) {
          status.classList.add("error");
          status.textContent = "Please enter your profile URL.";
          input.focus();
          return;
        }

        let parsedURL;

        try {
          parsedURL = new URL(value);
        } catch {
          status.classList.add("error");
          status.textContent =
            "Enter a valid URL, including https://";
          input.focus();
          return;
        }

        const validProtocol =
          parsedURL.protocol === "https:" ||
          parsedURL.protocol === "http:";

        const hostname = parsedURL.hostname
          .toLowerCase()
          .replace(/^www\./, "");

        const validHost = platformHosts[platform].some(
          (host) => hostname === host ||
                    hostname.endsWith("." + host)
        );

        if (!validProtocol || !validHost) {
          status.classList.add("error");
          status.textContent =
            `Enter a valid ${platform} profile URL.`;
          return;
        }

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const response = await fetch({{ url_for("api_platform_links")|tojson }}, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ platform, profile_url: parsedURL.href })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to save this profile link.");
          status.classList.add("success");
          status.textContent = result.message;
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message || "Unable to save this profile link.";
        } finally {
          button.disabled = false;
          button.textContent = "Connect Platforms";
        }
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;

        status.className = "status";
        status.textContent = "Importing JSON...";
        const formData = new FormData();
        formData.append("platform", platform);
        formData.append("file", file);
        fileInput.disabled = true;

        try {
          const importEndpoint = platform === "LeetCode"
            ? {{ url_for("api_leetcode_history_import")|tojson }}
            : {{ url_for("api_platform_links_import")|tojson }};
          const response = await fetch(importEndpoint, {
            method: "POST",
            body: formData
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to import this JSON file.");
          if (result.profile_url) input.value = result.profile_url;
          status.classList.add("success");
          status.textContent = result.message;
          if (result.history_url) {
            const historyLink = document.createElement("a");
            historyLink.href = result.history_url;
            historyLink.textContent = " View Coding History";
            status.append(historyLink);
          }
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message || "Unable to import this JSON file.";
        } finally {
          fileInput.disabled = false;
          fileInput.value = "";
        }
      });

      input.addEventListener("input", () => {
        status.className = "status";
        status.textContent = "";
      });
    });

    // Highlight the current navigation section.
    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach((link) => {
      link.addEventListener("click", () => {
        navLinks.forEach((item) => item.classList.remove("active"));
        link.classList.add("active");
      });
    });

    // Mark Connected Platforms as the current page.
    // Replace this with your app's actual route handling if needed.
  </script>
</body>
</html>
